name: Build Versus for iOS

on:
  workflow_dispatch:
  push:
    branches: ["main", "codex/ios-port"]
    paths:
      - "src/**"
      - "resources/**"
      - "CMakeLists.txt"
      - "mod.json"
      - "scripts/verify_ios_package.py"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS (${{ matrix.edition }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, membership]
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod for iOS
        id: build
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc
        with:
          sdk: given
          combine: false
          target: iOS
          # The newer generator removed umbrella includes needed by SDK 5.7.1 on iOS.
          bindings-ref: 13436953582c8bfa6d7a91392c9f575d5bafec83
          configure-args: >-
            -DVERSUS_MEMBERSHIP=${{ matrix.edition == 'membership' && 'ON' || 'OFF' }}
            -DSKIP_BUILDING_CODEGEN=OFF
      - name: Check the iOS binary and bundled resources
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
          VERSUS_EDITION: ${{ matrix.edition }}
        run: python3 scripts/verify_ios_package.py "$BUILD_OUTPUT" "$VERSUS_EDITION"
      - name: Upload iOS package for review
        uses: actions/upload-artifact@v4
        with:
          name: geode-iOS-${{ matrix.edition }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
